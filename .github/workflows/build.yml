name: Build CopyMod

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

# Serialise runs so the index-update job never races another push to main.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    env:
      THEOS: ${{ github.workspace }}/theos
      THEOS_PACKAGE_SCHEME: roothide
      SDK_VERSION: "18.6"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install packaging dependencies
        run: |
          brew install ldid dpkg xz

      - name: Install Theos (roothide fork)
        run: |
          git clone --recursive --depth 1 https://github.com/roothide/theos.git "$THEOS"
          echo "$THEOS/bin" >> "$GITHUB_PATH"

      - name: Install iOS SDK
        run: |
          set -euo pipefail
          mkdir -p "$THEOS/sdks"
          PRIMARY_URL="https://github.com/xybp888/iOS-SDKs/releases/download/iOS${SDK_VERSION}-SDKs/iPhoneOS${SDK_VERSION}.sdk.zip"
          FALLBACK_URL="https://github.com/xybp888/iOS-SDKs/releases/download/iOS18.5-SDKs/iPhoneOS18.5.sdk.zip"

          download() {
            local url="$1"
            # The GitHub release redirect can drop the connection; retry a few
            # times before giving up.
            curl -fL --retry 5 --retry-all-errors --retry-delay 5 \
                 --connect-timeout 30 --max-time 600 \
                 -o /tmp/sdk.zip "$url"
          }

          if ! download "$PRIMARY_URL"; then
            echo "Primary SDK download failed, falling back to iOS 18.5"
            download "$FALLBACK_URL"
          fi

          rm -rf /tmp/sdk
          unzip -q /tmp/sdk.zip -d /tmp/sdk
          # The archive contains a top level iPhoneOS<ver>.sdk directory.
          SDK_DIR="$(find /tmp/sdk -maxdepth 1 -type d -name 'iPhoneOS*.sdk' | head -n 1)"
          if [ -z "$SDK_DIR" ]; then
            echo "No .sdk directory found in the archive" >&2
            exit 1
          fi
          cp -R "$SDK_DIR" "$THEOS/sdks/"
          ls -la "$THEOS/sdks"

      - name: Build package
        run: |
          make clean || true
          make package FINALPACKAGE=1

      - name: Show produced package
        run: |
          ls -la packages/ || true

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: CopyMod-deb
          path: packages/*.deb
          if-no-files-found: error

      # On a tag push, publish the deb as a release asset so the Sileo repo
      # can point at a stable download URL.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DEB="$(ls packages/*.deb | head -n 1)"
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 \
            || gh release create "${GITHUB_REF_NAME}" --title "CopyMod ${GITHUB_REF_NAME}" \
                 --notes "Automated release for ${GITHUB_REF_NAME}."
          gh release upload "${GITHUB_REF_NAME}" "$DEB" --clobber

      # Rebuild the Sileo/Cydia index from the published releases and commit it
      # to docs/ on main (served by GitHub Pages). Only runs when a new release
      # may exist, i.e. on a tag push or a manual run.
      - name: Update repository index
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Work on main regardless of whether we were triggered by a tag.
          git fetch origin main
          git checkout -B main origin/main
          python3 tools/make_repo.py
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- docs/Packages docs/Packages.gz; then
            echo "Repository index already up to date"
            exit 0
          fi
          git add docs/Packages docs/Packages.gz docs/.nojekyll
          git commit -m "Update repository index [skip ci]"
          # Another push may land while this job runs; rebase before pushing.
          git fetch origin main
          git rebase origin/main
          git push origin main
