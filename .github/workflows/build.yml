name: Build CopyMod

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    env:
      THEOS: ${{ github.workspace }}/theos
      THEOS_PACKAGE_SCHEME: roothide
      SDK_VERSION: "18.6"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install packaging dependencies
        run: |
          brew install ldid dpkg xz

      - name: Install Theos (roothide fork)
        run: |
          git clone --recursive --depth 1 https://github.com/roothide/theos.git "$THEOS"
          echo "$THEOS/bin" >> "$GITHUB_PATH"

      - name: Install iOS SDK
        run: |
          mkdir -p "$THEOS/sdks"
          SDK_URL="https://github.com/xybp888/iOS-SDKs/releases/download/iOS${SDK_VERSION}-SDKs/iPhoneOS${SDK_VERSION}.sdk.zip"
          curl -L --fail -o /tmp/sdk.zip "$SDK_URL"
          unzip -q /tmp/sdk.zip -d /tmp/sdk
          # The archive contains a top level iPhoneOS<ver>.sdk directory.
          cp -R "/tmp/sdk/iPhoneOS${SDK_VERSION}.sdk" "$THEOS/sdks/"
          ls -la "$THEOS/sdks"

      - name: Build package
        run: |
          make clean || true
          make package FINALPACKAGE=1

      - name: Show produced package
        run: |
          ls -la packages/ || true

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: CopyMod-deb
          path: packages/*.deb
          if-no-files-found: error
